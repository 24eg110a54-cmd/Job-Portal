spring.application.name=smart-job-portal
server.port=${PORT:8081}

# Database — set DB_USER, DB_PASSWORD and DB_URL as environment variables in production.
# Local development fallback values are used when these vars are absent.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobportal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:ROOT}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Security — JWT_SECRET must be set in production; no fallback is provided to prevent accidental insecure deployments.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-ms=86400000
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}

# Never expose stack traces in error responses
server.error.include-stacktrace=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health
